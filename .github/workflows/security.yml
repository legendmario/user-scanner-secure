name: Security & SAST Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1' # Ejecución semanal automatizada para detectar nuevos CVEs

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bandit (Static Application Security Testing - SAST)
        run: |
          # Analiza el código en busca de patrones inseguros, inyecciones y fallas de configuración
          bandit -r secure_runner.py -ll

      - name: Run pip-audit (Vulnerability Scanner for Dependencies)
        run: |
          # Escanea las librerías contra la base de datos de vulnerabilidades conocidas (CVE / PyPA)
          pip-audit -r requirements.txt --desc
